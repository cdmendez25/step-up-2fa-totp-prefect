[project]
name = "backend-prefect"
version = "1.0.0"
description = "Backend Step-Up 2FA (TOTP desde cero) con observabilidad en Prefect y cifrado post-cuántico"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Prefect 3.8 dice aceptar FastAPI <1.0, pero su servidor se rompe desde la 0.155
    # (FastAPI eliminó el argumento min_items). Probado: 0.154 funciona.
    "fastapi>=0.139,<0.155",
    "uvicorn[standard]>=0.30",
    "prefect>=3.1,<4",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    "cryptography>=50",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
